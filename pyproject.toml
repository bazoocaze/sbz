[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbz"
version = "0.0.9"
description = "Sandboxed command execution via bubblewrap"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Shells",
]

[project.urls]
Homepage = "https://github.com/bazoocaze/sbz"
Repository = "https://github.com/bazoocaze/sbz"

[project.scripts]
sbz = "sbz:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
include = ["sbz.py", "sbz_completion.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
