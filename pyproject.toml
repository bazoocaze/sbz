[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbz"
version = "0.0.8"
description = "Sandboxed command execution via bubblewrap"
requires-python = ">=3.11"

[project.scripts]
sbz = "sbz:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
include = ["sbz.py", "sbz_completion.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
