[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sbz"
version = "0.0.5"
description = "Sandboxed command execution via bubblewrap"
requires-python = ">=3.10"

[project.scripts]
sbz = "sbz:main"

[tool.hatch.build.targets.wheel]
force-include = { "sbz_completion.py" = "sbz_completion.py" }
